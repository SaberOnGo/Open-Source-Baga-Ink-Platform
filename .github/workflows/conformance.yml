name: executable-spec-conformance

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: reference/python/pyproject.toml
      - name: Install reference implementation and tests
        run: python -m pip install -e 'reference/python[test]'
      - name: Run Python conformance tests
        run: python -m pytest -q

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Rust verifier
        id: rust-project
        shell: bash
        run: |
          if [[ -f reference/rust/baga-verifier/Cargo.toml ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.rust-project.outputs.exists == 'true'
      - name: Run Rust tests
        if: steps.rust-project.outputs.exists == 'true'
        working-directory: reference/rust/baga-verifier
        run: cargo test --all-targets
      - name: Rust verifier not added yet
        if: steps.rust-project.outputs.exists != 'true'
        run: echo 'Rust verifier will be added in Task 10.'
