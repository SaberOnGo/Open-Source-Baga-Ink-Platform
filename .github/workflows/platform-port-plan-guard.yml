name: Platform Port Plan Guard

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-platform-port-plans:
    name: Validate task/prompt layout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile plan guard tools
        run: python3 -m py_compile tools/check_platform_port_plans.py tools/new_platform_port_task.py

      - name: Validate platform-port plan structure
        run: python3 tools/check_platform_port_plans.py
