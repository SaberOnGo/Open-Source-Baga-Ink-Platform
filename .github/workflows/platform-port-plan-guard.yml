name: Repository Documentation Guard

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-platform-port-plans:
    # Keep this job name stable because the main-branch Ruleset requires it.
    name: Validate task/prompt layout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile repository guard tools
        run: >-
          python3 -m py_compile
          tools/check_platform_port_plans.py
          tools/new_platform_port_task.py
          tools/check_docs_i18n.py
          tools/new_localized_doc.py
          tools/check_readme_languages.py
          tools/check_licensing.py
          tools/check_public_writing.py

      - name: Validate public documentation internationalization
        run: python3 tools/check_docs_i18n.py

      - name: Validate README language switch registry
        run: python3 tools/check_readme_languages.py

      - name: Validate licensing architecture
        run: python3 tools/check_licensing.py

      - name: Validate repository-wide public writing
        run: python3 tools/check_public_writing.py

      - name: Validate platform-port plan structure
        run: python3 tools/check_platform_port_plans.py
